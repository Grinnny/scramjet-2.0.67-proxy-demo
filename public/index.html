<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="/scramjet/scramjet.js" defer></script> 
    <script src="/controller/controller.api.js" defer></script> 
    <script src="/index.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tabLogic.js" defer></script>
    <link href="css/main.css" rel="stylesheet">
</head>
<body class="">
    <div class="flex justify-center relative items-center flex-col" style="background-color: #050505; height:80px; top: 0px; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));" id="search-Container">
        <div style="height: 40px; width:90%;" class="flex flex-row gap-6" id="tabHolder">
            <div id="tab" class="tabExample tab0" style="height:30px; width:150px; background-color: #080808; border-radius: 5px;">
                <button style=" color: white; width:80%; height:100%; align-text:center;" onclick="switchTab(this)">Tab0</button>
                <button class="relative" style="color:white;" onclick="deleteTab(this)">X </button>
            </div>
            <div id="tab" class="tabExample tab1" style="height:30px; width:150px; background-color: #080808; border-radius: 5px;">
                <button style=" color: white; width:80%; height:100%; align-text:center;" onclick="switchTab(this)">Tab1</button>
                <button class="relative" style="color:white;" onclick="deleteTab(this)">X </button>
            </div>
            <div id="tab"class="tabExample tab2" style="height:30px; width:150px; background-color: #080808; border-radius: 5px;">
                <button style=" color: white; width:80%; height:100%; align-text:center;" onclick="switchTab(this)">Tab2</button>
                <button class="relative" style="color:white;" onclick="deleteTab(this)">X </button>
            </div>
            <div style="height: 30px; width:30px; color: white;" id="closeDiv">
                <button onclick="createTab()" style="font-size: 19px;">+</button>
            </div>
        </div>
        <form id="searchForm" class="relative" style="width: 80%;">
            <input class="relative searchForm" type="text" id="searchInput" style=" width: 100%; text-align: center;" placeholder="Search..."/>
        </form>
    </div>
    <div class="relative flex justify-center" style="width: 100%; height: 91.5vh; background-color: #010101; z-index: 2;" id="iframeContainer">
        <iframe id="search-iframe" class="search-iframe tab0" style="display: block; position:absolute; width: 100%; height: 100%;" src="p.html"></iframe>
        <iframe id="search-iframe" class="search-iframe tab1" style="display: none; position:absolute; width: 100%; height: 100%;" src="p.html"></iframe>
        <iframe id="search-iframe" class="search-iframe tab2" style="display: none; position:absolute; width: 100%; height: 100%;" src="p.html"></iframe>
    </div>
</body>
</html>
