<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="/scramjet/scramjet.js" defer></script> 
    <script src="/controller/controller.api.js" defer></script> 
    <script src="/index.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tabLogic.js" defer></script>
    <script src="js/iframeControls.js" defer></script>
    <link href="css/main.css" rel="stylesheet">
</head>
<body class="">
    <div class="flex justify-center relative items-center flex-col" style="background-color: #050505; height:80px; top: 0px; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));" id="search-Container">
        <div style="height: 40px; width:90%;" class="flex flex-row gap-6" id="tabHolder">
            <div id="tab" class="tabExample tab0" style="height:30px; width:150px; border-radius: 5px;">
                <button style="width:80%; height:100%; align-text:center;" onclick="switchTab(this)">New Tab</button>
                <button class="relative" style="color:white;" onclick="deleteTab(this)"><img src="img/icons8-close-48.png" style="width: 12px; height: 12px;"></button>
            </div>
            <div style="height: 30px; width:30px; color: white;" id="closeDiv">
                <button onclick="createTab()" style="font-size: 19px;">+</button>
            </div>
        </div>
        <div class="flex flex-start flex-row items-center" style="width: 100%; height:auto;">
               <div class="flex flex-row gap-4 justify-start items-center" style="margin-left: 5vw; width: 10%; height: auto;">
                    <button onclick="goBack()"><img src="img/arrow_back_30dp_D4F0F7_FILL0_wght400_GRAD0_opsz24.png" style="width: 25px; height: 25px;"></button>
                    <button onclick="refreshPage()"><img src="img/refresh_30dp_D4F0F7_FILL0_wght400_GRAD0_opsz24.png" style="width: 25px; height: 25px;"></button>
                    <button onclick="goForward()"><img src="img/arrow_forward_30dp_D4F0F7_FILL0_wght400_GRAD0_opsz24.png" style="width: 25px; height: 25px;"></button>
                </div>
                <form id="searchForm" class="relative" style="width: 80%;">
                <input class="relative searchForm" type="text" id="searchInput" style=" width: 100%; text-align: center;" placeholder="Search..."/>
            </form>
        </div>
    </div>
    <div class="relative flex justify-center" style="width: 100%; height: 91.5vh; background-color: #010101; z-index: 2;" id="iframeContainer">
        <iframe id="search-iframe" class="search-iframe tab0" style="display: block; position:absolute; width: 100%; height: 100%;" src="p.html"></iframe>
    </div>
    <footer style="z-index: 100; width: 100%; height: 25px; position: absolute; bottom: 0; background-color: #050505;" class="flex justify-center">
            <div style="color: white;">
                -FAV, Scramjet 2.0.67 Proxy Demo
            </div>
    </footer>
</body>
</html>
